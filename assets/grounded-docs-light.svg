<rect x="0.5" y="24" width="4" height="112" rx="2" fill="#0f766e"/>
<text x="28" y="48" font-size="23" font-weight="700" fill="#1f2328">Grounded Docs</text>
<rect x="28" y="60" width="93" height="20" rx="10" fill="#d7efe9"/>
<text x="75" y="74" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f766e">RAG · v1.2.0</text>
<text x="28" y="102" font-size="13" fill="#1f2328">RAG assistant for web and Slack that answers only from</text>
<text x="28" y="120" font-size="13" fill="#1f2328">a team's documents and verifies every quote in code.</text>
<text x="28" y="143" font-size="11" fill="#59636e" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace">FastAPI · OpenAI API · PostgreSQL · pgvector · Docker</text>
<rect x="436" y="24" width="132" height="112" rx="10" fill="#ffffff" stroke="#d0d7de"/><text x="502" y="72" text-anchor="middle" font-size="30" font-weight="700" fill="#0f766e">0</text><text x="502" y="98" text-anchor="middle" font-size="11" fill="#59636e">hallucinated answers</text><text x="502" y="113" text-anchor="middle" font-size="11" fill="#59636e">in 42 not-found trials</text><rect x="574" y="24" width="132" height="112" rx="10" fill="#ffffff" stroke="#d0d7de"/><text x="640" y="72" text-anchor="middle" font-size="30" font-weight="700" fill="#0f766e">94.0%</text><text x="640" y="98" text-anchor="middle" font-size="11" fill="#59636e">outcome accuracy</text><text x="640" y="113" text-anchor="middle" font-size="11" fill="#59636e">(synthetic corpus)</text><rect x="712" y="24" width="132" height="112" rx="10" fill="#ffffff" stroke="#d0d7de"/><text x="778" y="72" text-anchor="middle" font-size="30" font-weight="700" fill="#0f766e">5.77 s</text><text x="778" y="98" text-anchor="middle" font-size="11" fill="#59636e">p95 latency</text><text x="778" y="113" text-anchor="middle" font-size="11" fill="#59636e">(target 8 s)</text>
