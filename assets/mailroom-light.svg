<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 396" width="860" height="396" role="img" aria-label="Mailroom: An agent for a shared Gmail inbox that drafts replies and actions, and sends nothing until a person approves. 0 of 30 Prompt-injection emails that succeeded; 0 Unapproved writes, counted from the fake services&#x27; write logs; 96.0% Category accuracy, 48 of 50 threads. Measured on a pre-release build using gpt-6-luna, with 50 held-out threads and 30 prompt-injection emails, all synthetic, against fake Gmail, Calendar and HubSpot services. One published miss: escalation recall was 92.9% against a 95% target. 1,519 CI tests."><style>@font-face{font-family:"RHD800";src:url(data:font/woff2;base64,) format("woff2");}@font-face{font-family:"RHD700";src:url(data:font/woff2;base64,) format("woff2");}@font-face{font-family:"RHT400";src:url(data:font/woff2;base64,) format("woff2");}</style><defs><filter id="shadow" x="-5%" y="-10%" width="110%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="rgb(20 30 40 / 0.16)" flood-opacity="0.6"/></filter></defs><rect x="10" y="10" width="840" height="368" rx="24" fill="#ffffff" stroke="#d8dee4" filter="url(#shadow)"/><text x="42.0" y="66.0" font-family="RHD800" font-size="28" fill="#16212b" letter-spacing="-0.42">Mailroom</text><text x="42.0" y="94.0" font-family="RHD700" font-size="14.5" fill="#c2410c">Human-approved email agent, v1.0.0 · 2026</text><text x="42.0" y="126.0" font-family="RHT400" font-size="16" fill="#52606d">An agent for a shared Gmail inbox that drafts</text><text x="42.0" y="150.0" font-family="RHT400" font-size="16" fill="#52606d">replies and actions, and sends nothing until a</text><text x="42.0" y="174.0" font-family="RHT400" font-size="16" fill="#52606d">person approves.</text><text x="42.0" y="208.0" font-family="RHT400" font-size="13" fill="#52606d">Measured on a pre-release build using gpt-6-luna, with 50</text><text x="42.0" y="227.0" font-family="RHT400" font-size="13" fill="#52606d">held-out threads and 30 prompt-injection emails, all</text><text x="42.0" y="246.0" font-family="RHT400" font-size="13" fill="#52606d">synthetic, against fake Gmail, Calendar and HubSpot</text><text x="42.0" y="265.0" font-family="RHT400" font-size="13" fill="#52606d">services. One published miss: escalation recall was 92.9%</text><text x="42.0" y="284.0" font-family="RHT400" font-size="13" fill="#52606d">against a 95% target. 1,519 CI tests.</text><text x="42.0" y="342.0" font-family="RHD700" font-size="16" fill="#c2410c">View project</text><g transform="translate(143.4 328.5) scale(0.7500)" fill="none" stroke="#c2410c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></g><line x1="434" y1="38" x2="818" y2="38" stroke="#d8dee4"/><text x="434.0" y="84.0" font-family="RHD800" font-size="34" fill="#c2410c" letter-spacing="-0.68">0 of 30</text><text x="434.0" y="108.0" font-family="RHT400" font-size="14" fill="#52606d">Prompt-injection emails that succeeded</text><line x1="434" y1="134" x2="818" y2="134" stroke="#d8dee4"/><text x="434.0" y="180.0" font-family="RHD800" font-size="34" fill="#c2410c" letter-spacing="-0.68">0</text><text x="434.0" y="204.0" font-family="RHT400" font-size="14" fill="#52606d">Unapproved writes, counted from the fake services&#x27; write</text><text x="434.0" y="224.0" font-family="RHT400" font-size="14" fill="#52606d">logs</text><line x1="434" y1="250" x2="818" y2="250" stroke="#d8dee4"/><text x="434.0" y="296.0" font-family="RHD800" font-size="34" fill="#c2410c" letter-spacing="-0.68">96.0%</text><text x="434.0" y="320.0" font-family="RHT400" font-size="14" fill="#52606d">Category accuracy, 48 of 50 threads</text><line x1="434" y1="346" x2="818" y2="346" stroke="#d8dee4"/></svg>
