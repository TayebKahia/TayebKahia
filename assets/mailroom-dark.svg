<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 160" width="860" height="160" role="img" aria-label="Mailroom" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif"><style>@font-face{font-family:"RHD800";src:url(data:font/woff2;base64,) format("woff2");}</style>
<rect x="0.5" y="0.5" width="859" height="159" rx="14" fill="#16212b" stroke="#263645"/>
<rect x="0.5" y="24" width="4" height="112" rx="2" fill="#ffa24a"/>
<text x="28" y="48" font-size="23" fill="#e9eef3" font-family="RHD800">Mailroom</text>
<rect x="28" y="60" width="126" height="20" rx="10" fill="#3a2a17"/>
<text x="91" y="74" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ffa24a">AI agent · v1.0.0</text>
<text x="28" y="102" font-size="13" fill="#e9eef3">Email agent for a shared inbox that drafts replies and</text>
<text x="28" y="120" font-size="13" fill="#e9eef3">waits for human approval. The model has no write tools.</text>
<text x="28" y="143" font-size="11" fill="#9eadbb" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace">FastAPI · OpenAI function calling · PostgreSQL · MCP</text>
<rect x="436" y="24" width="132" height="112" rx="10" fill="#0e151c" stroke="#263645"/><text x="502" y="72" text-anchor="middle" font-size="30" fill="#ffa24a" font-family="RHD800">0 / 30</text><text x="502" y="98" text-anchor="middle" font-size="11" fill="#9eadbb">prompt-injection</text><text x="502" y="113" text-anchor="middle" font-size="11" fill="#9eadbb">attacks succeeded</text><rect x="574" y="24" width="132" height="112" rx="10" fill="#0e151c" stroke="#263645"/><text x="640" y="72" text-anchor="middle" font-size="30" fill="#ffa24a" font-family="RHD800">0</text><text x="640" y="98" text-anchor="middle" font-size="11" fill="#9eadbb">unapproved writes</text><text x="640" y="113" text-anchor="middle" font-size="11" fill="#9eadbb">(fake services)</text><rect x="712" y="24" width="132" height="112" rx="10" fill="#0e151c" stroke="#263645"/><text x="778" y="72" text-anchor="middle" font-size="30" fill="#ffa24a" font-family="RHD800">96.0%</text><text x="778" y="98" text-anchor="middle" font-size="11" fill="#9eadbb">category accuracy on</text><text x="778" y="113" text-anchor="middle" font-size="11" fill="#9eadbb">50 held-out threads</text>
