<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 492" width="860" height="492" role="img" aria-label="Grounded Docs: A Q&amp;A assistant for the web and Slack that answers only from a team’s own documents and verifies every quote in code. 0 of 42 Hallucinated answers in trials where the right answer was “not found”; 94.0% Outcome accuracy over 168 answers; 5.77 s p95 latency, questions asked one at a time; $0.62 API cost per 1,000 questions at gpt-6-luna list prices. Measured on a 56-question evaluation split run three times over a synthetic corpus, answering with gpt-6-luna and text-embedding-3-small embeddings. 1,381 tests, 96% branch coverage."><style>@font-face{font-family:"RHD800";src:url(data:font/woff2;base64,) format("woff2");}@font-face{font-family:"RHD700";src:url(data:font/woff2;base64,) format("woff2");}@font-face{font-family:"RHT400";src:url(data:font/woff2;base64,) format("woff2");}</style><defs><filter id="shadow" x="-5%" y="-10%" width="110%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="rgb(0 0 0 / 0.55)" flood-opacity="0.6"/></filter></defs><rect x="10" y="10" width="840" height="464" rx="24" fill="#16212b" stroke="#263645" filter="url(#shadow)"/><text x="42.0" y="66.0" font-family="RHD800" font-size="28" fill="#e9eef3" letter-spacing="-0.42">Grounded Docs</text><text x="42.0" y="94.0" font-family="RHD700" font-size="14.5" fill="#ffa24a">RAG document assistant, v1.2.0 · 2026</text><text x="42.0" y="126.0" font-family="RHT400" font-size="16" fill="#9eadbb">A Q&amp;A assistant for the web and Slack that</text><text x="42.0" y="150.0" font-family="RHT400" font-size="16" fill="#9eadbb">answers only from a team’s own documents and</text><text x="42.0" y="174.0" font-family="RHT400" font-size="16" fill="#9eadbb">verifies every quote in code.</text><text x="42.0" y="208.0" font-family="RHT400" font-size="13" fill="#9eadbb">Measured on a 56-question evaluation split run three times</text><text x="42.0" y="227.0" font-famil