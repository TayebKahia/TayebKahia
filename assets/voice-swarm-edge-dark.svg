<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 436" width="860" height="436" role="img" aria-label="Voice-Swarm-Edge: Voice commands for five simulated drones, parsed on a Raspberry Pi 5 by a fine-tuned small language model with no cloud. 27.9 tokens/s Qwen2.5-0.5B (Q4_K_M) on three actively cooled Raspberry Pi 5 CPU cores; 0.935 exact match 200 recorded commands, scored on reference transcripts, one speaker; 78 of 78 Keyword-spotter triggers for “hold” and “abort” that cancelled the in-flight decode. Measured on a Raspberry Pi 5 with 200 commands recorded by one speaker. The drones are simulated; nothing here was flown."><style>@font-face{font-family:"RHD800";src:url(data:font/woff2;base64,) format("woff2");}@font-face{font-family:"RHD700";src:url(data:font/woff2;base64,) format("woff2");}@font-face{font-family:"RHT400";src:url(data:font/woff2;base64,) format("woff2");}</style><defs><filter id="shadow" x="-5%" y="-10%" width="110%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="rgb(0 0 0 / 0.55)" flood-opacity="0.6"/></filter></defs><rect x="10" y="10" width="840" height="408" rx="24" fill="#16212b" stroke="#263645" filter="url(#shadow)"/><text x="42.0" y="66.0" font-family="RHD800" font-size="28" fill="#e9eef3" letter-spacing="-0.42">Voice-Swarm-Edge</text><text x="42.0" y="94.0" font-family="RHD700" font-size="14.5" fill="#ffa24a">On-device voice control with a fine-tuned small</text><text x="42.0" y="114.0" font-family="RHD700" font-size="14.5" fill="#ffa24a">language model · 2026</text><text x="42.0" y="146.0" font-family="RHT400" font-size="16" fill="#9eadbb">Voice commands for five simulated drones,</text><text x="42.0" y="170.0" font-family="RHT400" font-size="16" fill="#9eadbb">parsed on a Raspberry Pi 5 by a fine-tuned small</text><text x="42.0" y="194.0" font-family="RHT400" font-size="16" fill="#9eadbb">language model with no cloud.</text><text x="42.0" y="228.0" font-family="RHT400" font-size="13" fill="#9eadbb">Measured on a Raspberry Pi 5 with 200 commands recorded</text><text x="42.0" y="247.0" font-family="RHT400" font-size="13" fill="#9eadbb">by one speaker. The drones are simulated; nothing here was</text><text x="42.0" y="266.0" font-family="RHT400" font-size="13" fill="#9eadbb">flown.</text><text x="42.0" y="382.0" font-family="RHD700" font-size="16" fill="#ffa24a">View project</text><g transform="translate(143.4 368.5) scale(0.7500)" fill="none" stroke="#ffa24a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></g><line x1="434" y1="38" x2="818" y2="38" stroke="#263645"/><text x="434.0" y="84.0" font-family="RHD800" font-size="34" fill="#ffa24a" letter-spacing="-0.68">27.9</text><text x="510.9" y="84.0" font-family="RHD700" font-size="15" fill="#e9eef3">tokens/s</text><text x="434.0" y="108.0" font-family="RHT400" font-size="14" fill="#9eadbb">Qwen2.5-0.5B (Q4_K_M) on three actively cooled Raspberry</text><text x="434.0" y="128.0" font-family="RHT400" font-size="14" fill="#9eadbb">Pi 5 CPU cores</text><line x1="434" y1="154" x2="818" y2="154" stroke="#263645"/><text x="434.0" y="200.0" font-family="RHD800" font-size="34" fill="#ffa24a" letter-spacing="-0.68">0.935</text><text x="533.5" y="200.0" font-family="RHD700" font-size="15" fill="#e9eef3">exact match</text><text x="434.0" y="224.0" font-family="RHT400" font-size="14" fill="#9eadbb">200 recorded commands, scored on reference transcripts,</text><text x="434.0" y="244.0" font-family="RHT400" font-size="14" fill="#9eadbb">one speaker</text><line x1="434" y1="270" x2="818" y2="270" stroke="#263645"/><text x="434.0" y="316.0" font-family="RHD800" font-size="34" fill="#ffa24a" letter-spacing="-0.68">78 of 78</text><text x="434.0" y="340.0" font-family="RHT400" font-size="14" fill="#9eadbb">Keyword-spotter triggers for “hold” and “abort” that</text><text x="434.0" y="360.0" font-family="RHT400" font-size="14" fill="#9eadbb">cancelled the in-flight decode</text><l